name: build_windows_x64_zip

on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build_windows_x64_zip_release:
    runs-on: windows-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build Windows x64 release
        run: |
          cd simple_live_app
          # MSVC 14.52+ 弃用 <experimental/coroutine>，flutter_inappwebview_windows
          # 仍在使用该头文件，定义此宏抑制 C2338 (STL1011) 构建错误。
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release

      - name: Package Windows x64 release zip
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'simple_live_app\build\windows\x64\runner\Release'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'simple_live_windows_x64_release.zip'

          if (-not (Test-Path -LiteralPath $buildDir -PathType Container)) {
            throw "Windows release build output directory not found: $buildDir"
          }

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $buildDir '*') -DestinationPath $zipPath -Force

          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Zip package was not created: $zipPath"
          }

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "zip_name=$(Split-Path -Path $zipPath -Leaf)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows x64 release zip
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_windows_x64_release
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 1
          if-no-files-found: error

      - name: Write build summary
        shell: pwsh
        run: |
          "## Windows x64 release build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Artifact: ``simple_live_windows_x64_release``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Retention: 1 day" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
